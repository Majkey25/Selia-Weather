name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/wrapper-validation@v5

      - uses: gradle/actions/setup-gradle@v5

      - name: Test, lint, and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:bundleRelease --console=plain

      - name: Test radar loading and recovery
        run: node --test app/src/test/js/radar.test.cjs

      - uses: actions/upload-artifact@v7
        with:
          name: pocasi-cesko-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
