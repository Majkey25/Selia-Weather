name: Forecast data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      include_forecasts:
        description: Include validated forecast tiles; disable for a docs-only publication
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"

      - name: Install ecCodes
        run: sudo apt-get update && sudo apt-get install --yes libeccodes-tools

      - name: Install locked research environment
        run: uv sync --project research --frozen

      - name: Build verified operational diagnostic feed
        if: github.event_name != 'workflow_dispatch' || inputs.include_forecasts
        run: >-
          uv run --project research python -m aladin_ensemble.run_static_feed
          --docs-root docs
          --output "$RUNNER_TEMP/pages-site"
          --source-registry research/static-source-registry.json
          --operational
          --cache-root "$RUNNER_TEMP/forecast-cache"

      - name: Build documentation with an empty diagnostic feed
        if: github.event_name == 'workflow_dispatch' && !inputs.include_forecasts
        run: >-
          uv run --project research python -m aladin_ensemble.run_static_feed
          --docs-root docs
          --output "$RUNNER_TEMP/pages-site"
          --source-registry research/static-source-registry.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
