name: Research CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/**"
      - ".github/workflows/research.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/**"
      - ".github/workflows/research.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"

      - name: Install locked environment
        run: uv sync --project research --frozen

      - name: Test
        run: uv run --project research pytest -q

      - name: Lint
        run: uv run --project research ruff check .

      - name: Type check
        run: uv run --project research pyright
