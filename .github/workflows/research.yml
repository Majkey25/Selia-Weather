name: Research CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/**"
      - ".github/workflows/research.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/**"
      - ".github/workflows/research.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"

      - name: Install locked environment
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright
