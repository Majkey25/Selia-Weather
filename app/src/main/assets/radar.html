<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://api.rainviewer.com; img-src data: https://tile.openstreetmap.org https://tilecache.rainviewer.com; style-src 'self' file: 'unsafe-inline'; script-src 'self' file: 'unsafe-inline'; base-uri 'none'; object-src 'none'">
  <title>Observed radar</title>
  <link rel="stylesheet" href="leaflet-1.9.4.css">
  <style>
    * { box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; margin: 0; background: #071018; }
    body { overflow: hidden; color: #f4fafc; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    .leaflet-container { background: #071018; }
    .panel { position: fixed; z-index: 1000; left: 10px; right: 10px; bottom: 10px; padding: 10px 12px 9px; border: 1px solid #ffffff22; border-radius: 18px; background: #07131cee; backdrop-filter: blur(10px); }
    .topline { display: flex; align-items: center; min-height: 28px; gap: 8px; }
    .time { flex: 1; font-size: 13px; font-weight: 650; }
    .source { color: #a9bbc3; font-size: 10px; text-align: right; }
    button { min-width: 38px; height: 34px; border: 1px solid #ffffff24; border-radius: 12px; background: #172731; color: #f4fafc; font: inherit; }
    button.active { background: #2b6878; }
    button:focus-visible { outline: 2px solid #6dd3ea; outline-offset: 2px; }
    input[type=range] { width: 100%; margin: 8px 0 0; accent-color: #66c9df; }
    .status { position: fixed; z-index: 1001; left: 50%; top: 50%; width: min(82%, 360px); transform: translate(-50%, -50%); padding: 11px 14px; border-radius: 14px; background: #07131ce8; color: #d9e8ed; text-align: center; font-size: 13px; }
    .status[hidden] { display: none; }
    .leaflet-control-attribution { max-width: 82%; font-size: 8px; background: #07131ccc !important; color: #c7d5da; }
    .leaflet-control-attribution a { color: #8bd8ea; }
  </style>
</head>
<body>
  <div id="map" aria-label="Observed precipitation radar"></div>
  <div id="status" class="status">Loading observed radar…</div>
  <div class="panel">
    <div class="topline">
      <button id="play" type="button" aria-label="Play" onclick="togglePlay()">▶</button>
      <button id="coverage" class="active" type="button" aria-pressed="true" onclick="toggleCoverage()">Coverage</button>
      <div id="time" class="time">—</div>
      <div class="source">RainViewer · UTC</div>
    </div>
    <input id="slider" type="range" min="0" max="0" value="0" aria-label="Observed radar timeline" oninput="showFrame(Number(this.value))">
  </div>
  <script src="leaflet-1.9.4.js"></script>
  <script>
    var TEXTS = {
      en: { loading: 'Loading observed radar…', unavailable: 'Observed radar is unavailable for this area or time.', play: 'Play', pause: 'Pause', coverage: 'Coverage', map: 'Observed precipitation radar' },
      cs: { loading: 'Načítám pozorovaný radar…', unavailable: 'Pozorovaný radar pro tuto oblast nebo čas není dostupný.', play: 'Přehrát', pause: 'Pozastavit', coverage: 'Pokrytí', map: 'Pozorovaný srážkový radar' },
      de: { loading: 'Beobachtungsradar wird geladen…', unavailable: 'Für dieses Gebiet oder diese Zeit sind keine Radarbeobachtungen verfügbar.', play: 'Abspielen', pause: 'Pause', coverage: 'Abdeckung', map: 'Beobachtetes Niederschlagsradar' },
      es: { loading: 'Cargando radar observado…', unavailable: 'El radar observado no está disponible para esta zona o momento.', play: 'Reproducir', pause: 'Pausa', coverage: 'Cobertura', map: 'Radar de precipitación observado' },
      fr: { loading: 'Chargement du radar observé…', unavailable: 'Le radar observé est indisponible pour cette zone ou cette heure.', play: 'Lire', pause: 'Pause', coverage: 'Couverture', map: 'Radar des précipitations observées' }
    };
    var parameters = new URLSearchParams(window.location.search);
    var language = Object.prototype.hasOwnProperty.call(TEXTS, parameters.get('lang')) ? parameters.get('lang') : 'en';
    var TEXT = TEXTS[language];
    var latitude = coordinate(parameters.get('lat'), -90, 90, 50.0755);
    var longitude = coordinate(parameters.get('lon'), -180, 180, 14.4378);
    var MAX_FRAMES = 20;
    var frames = [];
    var frameIndex = 0;
    var radarLayer = null;
    var coverageLayer = null;
    var coverageVisible = true;
    var timer = null;
    var requestToken = 0;
    var tileHost = '';

    document.documentElement.lang = language;
    document.getElementById('status').textContent = TEXT.loading;
    document.getElementById('play').setAttribute('aria-label', TEXT.play);
    document.getElementById('coverage').textContent = TEXT.coverage;
    document.getElementById('map').setAttribute('aria-label', TEXT.map);

    var map = L.map('map', { maxZoom: 7, minZoom: 2, zoomControl: true }).setView([latitude, longitude], 6);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      minZoom: 2,
      maxZoom: 7,
      maxNativeZoom: 7,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    function coordinate(raw, minimum, maximum, fallback) {
      var value = Number(raw);
      return Number.isFinite(value) && value >= minimum && value <= maximum ? value : fallback;
    }

    function setStatus(message) {
      var status = document.getElementById('status');
      status.textContent = message;
      status.hidden = !message;
    }

    function clearRadarLayer() {
      if (radarLayer) {
        map.removeLayer(radarLayer);
        radarLayer = null;
      }
    }

    function radarTileUrl(frame) {
      return tileHost + frame.path + '/256/{z}/{x}/{y}/2/1_1.png';
    }

    function coverageTileUrl() {
      return tileHost + '/v2/coverage/0/256/{z}/{x}/{y}/0/0_0.png';
    }

    function installCoverageLayer() {
      if (!tileHost || coverageLayer) return;
      coverageLayer = L.tileLayer(coverageTileUrl(), {
        minZoom: 2,
        maxZoom: 7,
        maxNativeZoom: 7,
        opacity: 0.16,
        attribution: '<a href="https://www.rainviewer.com/">RainViewer</a>'
      });
      if (coverageVisible) coverageLayer.addTo(map);
    }

    function toggleCoverage() {
      coverageVisible = !coverageVisible;
      var button = document.getElementById('coverage');
      button.className = coverageVisible ? 'active' : '';
      button.setAttribute('aria-pressed', String(coverageVisible));
      if (!coverageLayer) return;
      if (coverageVisible) coverageLayer.addTo(map); else map.removeLayer(coverageLayer);
    }

    function showFrame(index) {
      if (!frames.length) {
        setStatus(TEXT.unavailable);
        return;
      }
      frameIndex = Math.max(0, Math.min(index, frames.length - 1));
      document.getElementById('slider').value = frameIndex;
      clearRadarLayer();
      radarLayer = L.tileLayer(radarTileUrl(frames[frameIndex]), {
        minZoom: 2,
        maxZoom: 7,
        maxNativeZoom: 7,
        opacity: 0.78,
        attribution: '<a href="https://www.rainviewer.com/">RainViewer</a>'
      });
      radarLayer.on('loading', function() { setStatus(TEXT.loading); });
      radarLayer.on('load', function() { setStatus(''); });
      radarLayer.on('tileerror', function() { setStatus(TEXT.unavailable); });
      radarLayer.addTo(map);
      document.getElementById('time').textContent = formatUtc(frames[frameIndex].time);
    }

    function formatUtc(epochSeconds) {
      var date = new Date(epochSeconds * 1000);
      return String(date.getUTCHours()).padStart(2, '0') + ':' +
        String(date.getUTCMinutes()).padStart(2, '0') + ' UTC';
    }

    function togglePlay() {
      var button = document.getElementById('play');
      if (timer) {
        clearInterval(timer);
        timer = null;
        button.textContent = '▶';
        button.setAttribute('aria-label', TEXT.play);
        return;
      }
      if (!frames.length) return;
      button.textContent = 'Ⅱ';
      button.setAttribute('aria-label', TEXT.pause);
      timer = setInterval(function() { showFrame((frameIndex + 1) % frames.length); }, 700);
    }

    function loadRadar() {
      var token = ++requestToken;
      setStatus(TEXT.loading);
      fetch('https://api.rainviewer.com/public/weather-maps.json', { cache: 'no-store' })
        .then(function(response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(function(manifest) {
          if (token !== requestToken) return;
          if (!manifest || !manifest.host || !manifest.radar || !Array.isArray(manifest.radar.past)) {
            throw new Error('Invalid RainViewer manifest');
          }
          tileHost = manifest.host;
          frames = manifest.radar.past.slice(-MAX_FRAMES);
          if (!frames.length) throw new Error('No radar frames');
          installCoverageLayer();
          var slider = document.getElementById('slider');
          slider.max = frames.length - 1;
          frameIndex = frames.length - 1;
          slider.value = frameIndex;
          showFrame(frameIndex);
        })
        .catch(function() {
          if (token !== requestToken) return;
          clearRadarLayer();
          setStatus(TEXT.unavailable);
        });
    }

    function selfTest() {
      if (coordinate('91', -90, 90, 1) !== 1 || coordinate('-33.8', -90, 90, 1) !== -33.8) {
        throw new Error('Radar coordinate self-test failed');
      }
      if (MAX_FRAMES !== 20 || !coverageTileUrl().includes('/v2/coverage/0/')) {
        throw new Error('Radar contract self-test failed');
      }
    }

    selfTest();
    loadRadar();
  </script>
</body>
</html>
