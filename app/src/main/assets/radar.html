<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://api.rainviewer.com https://maps.dwd.de; img-src data: https://tile.openstreetmap.org https://tilecache.rainviewer.com https://maps.dwd.de; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; object-src 'none'">
  <title>Radar</title>
  <link rel="stylesheet" href="leaflet-1.9.4.css">
  <style>
    * { box-sizing: border-box; }
    :root { --bg: #071018; --surface: #101e27; --text: #f4fafc; --muted: #b6c9d2; --border: #ffffff18; --accent: #a8deed; --on-accent: #10232c; --variant: #223541; --bottom-inset: 0px; }
    html, body { width: 100%; height: 100%; margin: 0; background: var(--bg); }
    body { position: relative; display: flex; flex-direction: column; overflow: hidden; color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
    #map { flex: 1 1 auto; min-height: 0; width: 100%; position: relative; }
    .leaflet-container { background: var(--bg); }
    .panel, .details { position: absolute; z-index: 1000; left: 12px; right: 12px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 24px; background: var(--surface); overflow: auto; box-shadow: 0 4px 24px #0003; }
    .panel { bottom: calc(var(--bottom-inset) + 12px); max-height: 45%; }
    .details { bottom: var(--details-bottom, 180px); max-height: var(--details-height, 45%); }
    body.details-open.details-over-panel .panel { visibility: hidden; }
    .meta { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
    .time { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .kind { color: var(--accent); font-size: 14px; font-weight: 650; }
    .topline { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 12px; }
    .source, .legend, .status, #frame-summary, #timeline-hint, .availability { color: var(--muted); font-size: 14px; line-height: 1.5; }
    button { min-width: 48px; min-height: 48px; border: 0; border-radius: 50%; background: var(--variant); color: var(--text); font: inherit; cursor: pointer; touch-action: manipulation; }
    button:disabled { opacity: 0.45; }
    button.active, #play { background: var(--accent); color: var(--on-accent); }
    button:active:not(:disabled) { background: var(--accent); color: var(--on-accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button svg { width: 24px; height: 24px; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    #pause-icon { display: none; }
    #play[aria-pressed=true] #play-icon { display: none; }
    #play[aria-pressed=true] #pause-icon { display: inline; }
    .tools { display: flex; position: absolute; z-index: 1000; right: 12px; top: calc(var(--header-inset, 64px) + 8px); gap: 8px; }
    .timeline { position: relative; min-width: 0; }
    input[type=range] { display: block; width: 100%; min-width: 0; height: 48px; margin: 0; accent-color: var(--accent); }
    #timeline-marks { position: absolute; height: 5px; bottom: 1px; left: 8px; right: 8px; pointer-events: none; }
    #timeline-marks span { position: absolute; height: 5px; border-radius: 2px; background: var(--accent); }
    #timeline-marks .forecast-mark { background: var(--muted); opacity: 0.65; }
    #timeline-marks .now-mark { width: 2px; height: 10px; bottom: 0; background: var(--text); }
    .range { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; margin: 4px 0; }
    #timeline-hint { margin-top: 4px; }
    .status { margin-top: 6px; }
    .status[hidden] { display: none !important; }
    .leaflet-control-attribution { max-width: calc(100vw - 24px); font-size: 11px; background: var(--surface) !important; color: var(--muted); }
    .leaflet-control-attribution a { color: var(--accent); }
    .leaflet-top .leaflet-control-attribution { margin-top: 0; }
    .leaflet-top.leaflet-right { top: var(--controls-bottom, 128px); }
    .detail-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    #coverage { padding: 8px 16px; border-radius: 24px; }
    #frame-summary, .availability { margin: 8px 0; }
    .legend { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
    #observed-scale { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 8px; font-size: 14px; }
    #observed-scale span { display: inline-flex; align-items: center; gap: 6px; }
    #observed-scale i { width: 14px; height: 14px; border-radius: 50%; background: var(--swatch); }
    #scale { max-width: 100%; margin-top: 8px; background: white; }
    .radar-frame { transition: opacity 350ms linear; }
    [hidden] { display: none !important; }
    body.short .panel { display: flex; flex-direction: column; padding: 6px 12px; }
    body.short .topline { order: -1; flex-shrink: 0; }
    body.short #timeline-hint { display: none; }
    @media (min-width: 700px) { .panel { max-width: 680px; margin: 0 auto; } .details { left: auto; width: min(440px, calc(100% - 24px)); } }
    @media (prefers-reduced-motion: reduce) { .radar-frame { transition: none; } }
  </style>
</head>
<body>
  <div id="map" aria-label="Precipitation map"></div>
  <div id="radar-tools" class="tools">
    <button id="center" type="button" aria-label="Show selected location" onclick="map.setView([latitude, longitude], map.getZoom())"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></button>
    <button id="details-toggle" type="button" aria-label="Layers and details" aria-expanded="false" aria-controls="details" onclick="toggleDetails()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 8 9-5 9 5-9 5Zm0 4 9 5 9-5m-18 4 9 5 9-5"/></svg></button>
  </div>
  <div class="panel">
    <div class="meta"><span id="frame-kind" class="kind"></span><span id="time" class="time">—</span></div>
    <div class="topline">
      <button id="play" type="button" aria-label="Play" aria-pressed="false" onclick="togglePlay()" disabled><svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z" fill="currentColor" stroke="none"/></svg><svg id="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg></button>
      <div class="timeline"><input id="slider" type="range" min="0" max="0" value="0" step="1" aria-label="Precipitation timeline" oninput="seekTime(Number(this.value))" onkeydown="timelineKey(event)" disabled><div id="timeline-marks" aria-hidden="true"></div></div>
      <button id="retry" type="button" aria-label="Refresh precipitation" onclick="refreshMap()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></svg></button>
    </div>
    <div class="range"><span id="range-start">—</span><span id="range-end">—</span></div>
    <div id="timeline-hint"></div>
    <div id="status" class="status" role="status">Loading precipitation…</div>
  </div>
  <div id="details" class="details" hidden>
    <div id="frame-summary"></div>
    <div id="source" class="source">RainViewer · Deutscher Wetterdienst</div>
    <div class="detail-controls">
      <button id="coverage" class="active" type="button" aria-pressed="true" onclick="toggleCoverage()">Coverage</button>
      <button id="zoom-out" type="button" aria-label="Zoom out" onclick="map.zoomOut()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button id="zoom-in" type="button" aria-label="Zoom in" onclick="map.zoomIn()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
    </div>
    <div id="observed-status" class="availability"></div>
    <div id="forecast-status" class="availability"></div>
    <div id="legend" class="legend"></div>
    <div id="observed-scale" hidden><span><i style="--swatch:#00a3e0"></i>20 dBZ</span><span><i style="--swatch:#005588"></i>30 dBZ</span><span><i style="--swatch:#ffaa00"></i>40 dBZ</span><span><i style="--swatch:#c10000"></i>50 dBZ</span></div>
    <img id="scale" hidden alt="DWD precipitation legend, mm">
  </div>
  <script src="leaflet-1.9.4.js"></script>
  <script src="radar-forecast.js"></script>
  <script>

      de: { loading: 'Beobachtungsradar wird geladen…', unavailable: 'Für dieses Gebiet oder diese Zeit sind keine Radarbeobachtungen verfügbar.', play: 'Abspielen', pause: 'Pause', coverage: 'Abdeckung', map: 'Niederschlagskarte' },

      de: ['Beobachtet', 'Prognose', 'Modellprognose wird geladen…', 'Modellprognose nicht verfügbar. Später erneut versuchen.', 'Prognose aktualisieren', 'Modellniederschlag', 'mm / 1 h', 'mm / 6 h', 'Anbieter ausgelastet. Später erneut versuchen.', 'Farben zeigen vorhergesagte Niederschlagsmengen im Zeitraum, keine Radarbeobachtungen. Die Genauigkeit nimmt mit der Vorhersagezeit ab. Transparente Gebiete liegen unter dem Schwellenwert.'],

      fr: ['Couches et détails', 'Dézoomer', 'Zoomer', 'Afficher le lieu choisi', 'Actualiser les précipitations', 'Chronologie des précipitations', 'Images radar · Intervalles prévus · Lacunes sans données.', 'Image radar · heure de génération. Les couleurs de pluie montrent la réflectivité en dBZ; la neige a des couleurs distinctes. La couverture indique les zones sans radar.']
    };
    var UPDATE_TEXTS = {
      en: ['Radar update unavailable. Showing the previous snapshot.', 'Model update unavailable. Showing the previous forecast.'],
      cs: ['Obnova radaru není dostupná. Zobrazuji předchozí snímek.', 'Obnova modelu není dostupná. Zobrazuji předchozí předpověď.'],
      de: ['Radaraktualisierung nicht verfügbar. Das vorherige Bild wird angezeigt.', 'Modellaktualisierung nicht verfügbar. Die vorherige Prognose wird angezeigt.'],
      es: ['Actualización del radar no disponible. Se muestra la imagen anterior.', 'Actualización del modelo no disponible. Se muestra el pronóstico anterior.'],
      fr: ['Mise à jour radar indisponible. L’image précédente est affichée.', 'Mise à jour du modèle indisponible. Les prévisions précédentes sont affichées.']
    };
    var parameters = new URLSearchParams(window.location.search);
    var language = Object.prototype.hasOwnProperty.call(TEXTS, parameters.get('lang')) ? parameters.get('lang') : 'en';

    try { new Intl.DateTimeFormat(language, { timeZone: timezone }).format(); }
    catch (_) { timezone = 'UTC'; }
    var TEXT = TEXTS[language], FORECAST_TEXT = FORECAST_TEXTS[language], CONTROL_TEXT = CONTROL_TEXTS[language];
    var UPDATE_TEXT = UPDATE_TEXTS[language];
    var latitude = coordinate(parameters.get('lat'), -90, 90, 50.0755);
    var longitude = coordinate(parameters.get('lon'), -180, 180, 14.4378);
    var headerInset = 64, bottomInset = 0, viewportHeight = 0;
    var MAX_FRAMES = 20, REQUEST_TIMEOUT_MS = 15000, REFRESH_INTERVAL_MS = 600000, MAX_FRAME_AGE_SECONDS = 3600;
    var frames = [], frameIndex = 0, selectedTime = null;
    var nativeActive = parameters.get('nativeActive') !== '0', selectionTouched = false, initialObservationSelected = false;
    var observedCache = null, forecastCache = null, forecastModels = { eu: null, global: null };
    var observedState = { request: null, token: 0, timeout: null, retryAt: 0, failed: false, attemptedAt: 0, message: '' };
    var forecastState = { request: null, token: 0, timeout: null, keys: [], message: '' };
    var forecastStates = { eu: { retryAt: 0, failed: false, attemptedAt: 0 }, global: { retryAt: 0, failed: false, attemptedAt: 0 } };
    var radarLayer = null, pendingLayer = null, preloadLayer = null, retiredLayer = null;
    var coverageLayer = null, coverageVisible = true, tileHost = '';
    var timer = null, seekTimer = null, seekTarget = null, expiryTimer = null;
    var transitionTimer = null, tileTimeout = null, panTimeout = null, statusMessage = '';

    function positionControls() {
      var controlsBottom = headerInset + (document.getElementById('radar-tools').offsetHeight || 48) + 16;
      document.documentElement.style.setProperty('--controls-bottom', controlsBottom + 'px');
      if (viewportHeight > 0) {
        var creditsHeight = typeof map !== 'undefined' && map ? map.attributionControl.getContainer().offsetHeight || 0 : 0;
        var panel = document.querySelector('.panel');
        var rowFloor = (document.querySelector('.topline').offsetHeight || 48) + (viewportHeight <= 400 ? 14 : 26);

          viewportHeight - controlsBottom - creditsHeight - bottomInset - 32)) + 'px';
        var detailsBottom = bottomInset + (panel.offsetHeight || 160) + 20;
        var detailsHeight = viewportHeight - controlsBottom - creditsHeight - detailsBottom - 8;
        var replacePanel = detailsHeight < 144;
        document.body.classList.toggle('details-over-panel', replacePanel);
        if (replacePanel) {

          detailsHeight = viewportHeight - controlsBottom - creditsHeight - detailsBottom - 16;
        }

      }
    }

      Object.keys(roles).forEach(function(key) {
        if (typeof values[key] === 'string' && /^#[0-9a-fA-F]{6}$/.test(values[key])) {

      });
      if (Number.isFinite(values.topInset) && values.topInset >= 0 && values.topInset <= 240) {

      var details = document.getElementById('details');

    var map = L.map('map', { maxZoom: 11, minZoom: 2, zoomControl: false }).setView([latitude, longitude], 6);

    function coordinate(raw, minimum, maximum, fallback) {
      if (raw === null || String(raw).trim() === '') return fallback;

    function pageActive() { return nativeActive && !document.hidden; }
    function setStatus(message) { statusMessage = message; renderStatus(); }

    }
    function clearPending() {

    function clearRadarLayer() {

      clearTimeout(transitionTimer); transitionTimer = null;
      [radarLayer, preloadLayer, retiredLayer].forEach(function(layer) { if (layer) map.removeLayer(layer); });

    function sameFrame(a, b) {
      return a && b && a.time === b.time && a.type === b.type && a.key === b.key &&

    }
    function sameSource(a, b) {
      return a && b && a.type === b.type && a.key === b.key && a.reference === b.reference;
    }

    function installCoverageLayer() {
      if (!tileHost || coverageLayer) return;
      coverageLayer = L.tileLayer(coverageTileUrl(), { minZoom: 2, maxZoom: 11, maxNativeZoom: 7,

    }
    function toggleCoverage() {
      coverageVisible = !coverageVisible;
      var button = document.getElementById('coverage');
      button.className = coverageVisible ? 'active' : '';
