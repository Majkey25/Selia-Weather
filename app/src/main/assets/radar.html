<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://api.rainviewer.com https://maps.dwd.de; img-src data: https://tile.openstreetmap.org https://tilecache.rainviewer.com https://maps.dwd.de; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; object-src 'none'">
  <title>Radar</title>
  <link rel="stylesheet" href="leaflet-1.9.4.css">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #071018; }
    body { display: flex; flex-direction: column; overflow: hidden; color: #f4fafc; font-family: system-ui, sans-serif; }
    #map { flex: 1 1 auto; min-height: 0; width: 100%; position: relative; }
    .leaflet-container { background: #071018; }
    .panel { flex: 0 0 auto; padding: 12px; border-top: 1px solid #ffffff18; background: #101e27; max-height: 55%; overflow: auto; }
    .topline { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 12px; }
    .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .time { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .source { color: #b6c9d2; font-size: 11px; line-height: 1.6; }
    button { min-width: 48px; min-height: 48px; border: 0; border-radius: 24px; background: #223541; color: #f4fafc; font: inherit; cursor: pointer; touch-action: manipulation; }
    button:disabled { opacity: 0.45; }
    button.active { background: #a8deed; color: #10232c; font-weight: 650; }
    button:active:not(:disabled) { background: #3d6575; color: white; }
    button:focus-visible { outline: 2px solid #6dd3ea; outline-offset: 2px; }
    button svg { width: 22px; height: 22px; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    #play { background: #a8deed; color: #10232c; }
    #pause-icon { display: none; }
    #play[aria-pressed=true] #play-icon { display: none; }
    #play[aria-pressed=true] #pause-icon { display: inline; }
    input[type=range] { width: 100%; min-width: 0; height: 48px; margin: 0; accent-color: #66c9df; }
    .status { min-height: 20px; color: #d9e8ed; font-size: 12px; line-height: 18px; }
    .status[hidden] { display: block !important; visibility: hidden; }
    .leaflet-control-attribution { max-width: 82%; font-size: 8px; background: #07131ccc !important; color: #c7d5da; }
    .leaflet-control-attribution a { color: #8bd8ea; }
    .modes { display: flex; flex: 0 0 auto; gap: 6px; padding: 8px; background: #101e27; }
    .modes button { flex: 1; font-size: 13px; padding: 0 10px; }
    .modes #details-toggle { flex: 0 0 48px; padding: 0; }
    #details { margin-top: 8px; border-top: 1px solid #ffffff22; padding-top: 8px; }
    .legend { color: #b8cbd3; font-size: 12px; line-height: 1.5; margin-top: 6px; }
    .range { display: flex; justify-content: space-between; color: #b6c9d2; font-size: 11px; padding: 0 60px 6px; }
    #frame-summary { color: #b6c9d2; font-size: 12px; line-height: 18px; margin: 4px 0; }
    .radar-frame { transition: opacity 350ms linear; }
    #scale { max-width: 100%; margin-top: 6px; background: white; }
    [hidden] { display: none !important; }
    @media (max-height: 400px) { .panel { padding: 6px 12px; } #frame-summary { display: none; } }
    @media (prefers-reduced-motion: reduce) { .radar-frame { transition: none; } }
  </style>
</head>
<body>
    <div class="modes">
      <button id="observed" class="active" type="button" aria-pressed="true" onclick="setMode('observed')">Observed</button>
      <button id="forecast" type="button" aria-pressed="false" onclick="setMode('forecast')">Forecast +12h</button>
      <button id="details-toggle" type="button" aria-label="Radar details" aria-expanded="false" aria-controls="details" onclick="toggleDetails()"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.1"/></svg></button>
    </div>
  <div id="map" aria-label="Observed precipitation radar"></div>
  <div class="panel">
    <div class="meta">
      <div id="time" class="time">—</div>
    </div>
    <div class="topline">
      <button id="play" type="button" aria-label="Play" aria-pressed="false" onclick="togglePlay()" disabled><svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z" fill="currentColor" stroke="none"/></svg><svg id="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg></button>
      <input id="slider" type="range" min="0" max="0" value="0" aria-label="Observed radar timeline" oninput="seekFrame(Number(this.value))" disabled>
      <button id="retry" type="button" aria-label="Refresh radar" onclick="refreshMap()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></svg></button>
    </div>
    <div class="range"><span id="range-start">—</span><span id="range-end">—</span></div>
    <div id="frame-summary" hidden></div>
    <div id="status" class="status" role="status">Loading observed radar…</div>
    <div id="details" hidden>
      <div id="source" class="source">RainViewer · UTC</div>
      <button id="coverage" class="active" type="button" aria-pressed="true" onclick="toggleCoverage()">Coverage</button>
      <button id="zoom-out" type="button" aria-label="Zoom out" onclick="map.zoomOut()">−</button>
      <button id="zoom-in" type="button" aria-label="Zoom in" onclick="map.zoomIn()">+</button>
      <div id="legend" class="legend" hidden></div>
      <img id="scale" hidden alt="DWD precipitation legend, mm">
    </div>
  </div>
  <script src="leaflet-1.9.4.js"></script>
  <script src="radar-forecast.js"></script>
  <script>
    var TEXTS = {
      en: { loading: 'Loading observed radar…', unavailable: 'Observed radar is unavailable for this area or time.', play: 'Play', pause: 'Pause', coverage: 'Coverage', map: 'Observed precipitation radar' },
      cs: { loading: 'Načítám pozorovaný radar…', unavailable: 'Pozorovaný radar pro tuto oblast nebo čas není dostupný.', play: 'Přehrát', pause: 'Pozastavit', coverage: 'Pokrytí', map: 'Pozorovaný srážkový radar' },
      de: { loading: 'Beobachtungsradar wird geladen…', unavailable: 'Für dieses Gebiet oder diese Zeit sind keine Radarbeobachtungen verfügbar.', play: 'Abspielen', pause: 'Pause', coverage: 'Abdeckung', map: 'Beobachtetes Niederschlagsradar' },
      es: { loading: 'Cargando radar observado…', unavailable: 'El radar observado no está disponible para esta zona o momento.', play: 'Reproducir', pause: 'Pausa', coverage: 'Cobertura', map: 'Radar de precipitación observado' },
      fr: { loading: 'Chargement du radar observé…', unavailable: 'Le radar observé est indisponible pour cette zone ou cette heure.', play: 'Lire', pause: 'Pause', coverage: 'Couverture', map: 'Radar des précipitations observées' }
    };
    var parameters = new URLSearchParams(window.location.search);
    var language = Object.prototype.hasOwnProperty.call(TEXTS, parameters.get('lang')) ? parameters.get('lang') : 'en';
    var timezone = parameters.get('tz') || 'UTC';
    try { new Intl.DateTimeFormat(language, { timeZone: timezone }).format(); }
    catch (_) { timezone = 'UTC'; }
    var TEXT = TEXTS[language];
    var latitude = coordinate(parameters.get('lat'), -90, 90, 50.0755);
    var longitude = coordinate(parameters.get('lon'), -180, 180, 14.4378);
    var MAX_FRAMES = 20;
    var frames = [];
    var frameIndex = 0;
    var radarLayer = null;
    var coverageLayer = null;
    var coverageVisible = true;
    var timer = null;
    var seekTimer = null;
    var seekIndex = null;
    var requestToken = 0;
    var tileHost = '';
    var activeRequest = null;
    var lastLoadedAt = 0;
    var REQUEST_TIMEOUT_MS = 15000;
    var REFRESH_INTERVAL_MS = 600000;
    var MAX_FRAME_AGE_SECONDS = 3600;
    var mode = 'observed';
    var pendingLayer = null, preloadLayer = null, retiredLayer = null;
    var transitionTimer = null, tileTimeout = null, panTimeout = null, forecastExpiryTimer = null;
    var forecastCache = null, forecastModels = { eu: null, global: null };
    var forecastRetryAt = 0, forecastRefreshPending = false, forecastRefreshFailed = false;
    var statusMessage = '';
    var FORECAST_TEXTS = {
      en: ['Observed', 'Forecast +12h', 'Loading model forecast…', 'Model forecast unavailable. Try again later.', 'Refresh forecast', 'Model precipitation', 'mm / 1 h', 'mm / 6 h', 'Provider is busy. Try again later.', 'Colors show precipitation totals for the displayed interval. Clear areas are below the legend threshold.'],
      cs: ['Pozorování', 'Předpověď +12 h', 'Načítám modelovou předpověď…', 'Modelová předpověď není dostupná. Zkuste to později.', 'Obnovit předpověď', 'Modelové srážky', 'mm / 1 h', 'mm / 6 h', 'Poskytovatel je přetížený. Zkuste to později.', 'Barvy znázorňují úhrn srážek za zobrazený interval. Průhledné oblasti jsou pod prahem legendy.'],
      de: ['Beobachtet', 'Prognose +12 h', 'Modellprognose wird geladen…', 'Modellprognose nicht verfügbar. Später erneut versuchen.', 'Prognose aktualisieren', 'Modellniederschlag', 'mm / 1 h', 'mm / 6 h', 'Anbieter ausgelastet. Später erneut versuchen.', 'Farben zeigen die Niederschlagsmenge im angezeigten Zeitraum. Transparente Gebiete liegen unter dem Schwellenwert der Legende.'],
      es: ['Observado', 'Pronóstico +12 h', 'Cargando pronóstico del modelo…', 'Pronóstico no disponible. Inténtalo más tarde.', 'Actualizar pronóstico', 'Precipitación del modelo', 'mm / 1 h', 'mm / 6 h', 'Proveedor ocupado. Inténtalo más tarde.', 'Los colores indican la precipitación acumulada del intervalo mostrado. Las zonas transparentes están por debajo del umbral de la leyenda.'],
      fr: ['Observé', 'Prévision +12 h', 'Chargement des prévisions…', 'Prévisions indisponibles. Réessayez plus tard.', 'Actualiser les prévisions', 'Précipitations du modèle', 'mm / 1 h', 'mm / 6 h', 'Fournisseur occupé. Réessayez plus tard.', 'Les couleurs indiquent le cumul sur la période affichée. Les zones transparentes sont sous le seuil de la légende.']
    };
    var FORECAST_TEXT = FORECAST_TEXTS[language];
    var DETAIL_TEXTS = {
      en: ['Radar details', 'Zoom out', 'Zoom in'],
      cs: ['Podrobnosti radaru', 'Oddálit', 'Přiblížit'],
      de: ['Radardetails', 'Verkleinern', 'Vergrößern'],
      es: ['Detalles del radar', 'Alejar', 'Acercar'],
      fr: ['Détails du radar', 'Dézoomer', 'Zoomer']
    };
    var FORECAST_EXPIRED = {
      en: 'Forecast expired. Refresh forecast.',
      cs: 'Předpověď už není aktuální. Obnovte ji.',
      de: 'Prognose abgelaufen. Prognose aktualisieren.',
      es: 'El pronóstico ha caducado. Actualízalo.',
      fr: 'Prévisions expirées. Actualisez-les.'
    };
    var CONTROL_TEXTS = {
      en: ['Refresh radar', 'Observed radar timeline'],
      cs: ['Obnovit radar', 'Časová osa pozorovaného radaru'],
      de: ['Radar aktualisieren', 'Zeitleiste des Beobachtungsradars'],
      es: ['Actualizar radar', 'Línea temporal del radar observado'],
      fr: ['Actualiser le radar', 'Chronologie du radar observé']
    };

    document.documentElement.lang = language;
    document.getElementById('status').textContent = TEXT.loading;
    document.getElementById('play').setAttribute('aria-label', TEXT.play);
    document.getElementById('coverage').textContent = TEXT.coverage;
    document.getElementById('map').setAttribute('aria-label', TEXT.map);
    document.getElementById('retry').setAttribute('aria-label', CONTROL_TEXTS[language][0]);
    document.getElementById('slider').setAttribute('aria-label', CONTROL_TEXTS[language][1]);
    document.getElementById('observed').textContent = FORECAST_TEXT[0];
    document.getElementById('forecast').textContent = FORECAST_TEXT[1];
    ['details-toggle', 'zoom-out', 'zoom-in'].forEach(function(id, index) {
      document.getElementById(id).setAttribute('aria-label', DETAIL_TEXTS[language][index]);
    });

    function toggleDetails() {
      var details = document.getElementById('details');
      details.hidden = !details.hidden;
      document.getElementById('details-toggle').setAttribute('aria-expanded', String(!details.hidden));
      requestAnimationFrame(function() { map.invalidateSize(false); });
    }

    function sizeViewport() {
      // Android WebView can resolve both % and vh to zero during attachment.
      var height = window.innerHeight;
      if (Number.isFinite(height) && height > 0) {
        document.documentElement.style.height = height + 'px';
        document.body.style.height = height + 'px';
      }
    }
    sizeViewport();
    var map = L.map('map', { maxZoom: 11, minZoom: 2, zoomControl: false }).setView([latitude, longitude], 6);
    L.circleMarker([latitude, longitude], { radius: 5, color: '#ffffff', weight: 2,
      fillColor: '#145f79', fillOpacity: 1, interactive: false }).addTo(map);
    map.on('moveend', function() {
      if (mode === 'forecast' && !document.hidden) loadForecast();
    });
    window.addEventListener('resize', function() {
      sizeViewport();
      map.invalidateSize(false);
    });
    requestAnimationFrame(function() { sizeViewport(); map.invalidateSize(false); });
    new ResizeObserver(function() { map.invalidateSize(false); }).observe(document.getElementById('map'));
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      minZoom: 2,
      maxZoom: 11,
      maxNativeZoom: 11,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    function coordinate(raw, minimum, maximum, fallback) {
      if (raw === null || String(raw).trim() === '') return fallback;
      var value = Number(raw);
      return Number.isFinite(value) && value >= minimum && value <= maximum ? value : fallback;
    }

    function setStatus(message) {
      statusMessage = message;
      renderStatus();
    }

    function renderStatus() {
      var status = document.getElementById('status');
      status.textContent = statusMessage;
      status.hidden = !statusMessage;
    }

    function clearRadarLayer() {
      cancelSeek();
      clearTimeout(forecastExpiryTimer); forecastExpiryTimer = null;
      clearTimeout(tileTimeout); tileTimeout = null;
      clearTimeout(panTimeout); panTimeout = null;
      clearTimeout(transitionTimer); transitionTimer = null;
      [pendingLayer, preloadLayer, retiredLayer].forEach(function(layer) { if (layer) map.removeLayer(layer); });
      pendingLayer = preloadLayer = retiredLayer = null;
      if (radarLayer) {
        map.removeLayer(radarLayer);
        radarLayer = null;
      }
    }

    function radarTileUrl(frame) {
      return tileHost + frame.path + '/512/{z}/{x}/{y}/2/1_1.png';
    }

    function coverageTileUrl() {
      return tileHost + '/v2/coverage/0/256/{z}/{x}/{y}/0/0_0.png';
    }

    function installCoverageLayer() {
      if (!tileHost || coverageLayer) return;
      coverageLayer = L.tileLayer(coverageTileUrl(), {
        minZoom: 2,
        maxZoom: 11,
        maxNativeZoom: 7,
        opacity: 0.16,
        attribution: '<a href="https://www.rainviewer.com/">RainViewer</a>'
      });
      if (coverageVisible && mode === 'observed') coverageLayer.addTo(map);
    }

    function toggleCoverage() {
      coverageVisible = !coverageVisible;
      var button = document.getElementById('coverage');
      button.className = coverageVisible ? 'active' : '';
      button.setAttribute('aria-pressed', String(coverageVisible));
      if (!coverageLayer) return;
      if (coverageVisible && mode === 'observed') coverageLayer.addTo(map); else map.removeLayer(coverageLayer);
    }

    function newFrameLayer(index) {
      var frame = frames[index], layer;
      if (frame.type === 'forecast') {
        var source = RadarForecast.sources[frame.key];
        layer = L.tileLayer.wms(RadarForecast.endpoint, {
          layers: 'dwd:' + source.layer, styles: source.style, format: 'image/png', transparent: true,
          version: '1.1.1', time: new Date(frame.time * 1000).toISOString(), dim_reference_time: frame.reference,
          minZoom: 2, maxZoom: 11, tileSize: 256, keepBuffer: 0, updateWhenIdle: true,
          opacity: 0, className: 'radar-frame',
          attribution: '<a href="https://www.dwd.de/copyright">Deutscher Wetterdienst · CC BY 4.0</a>'
        });
      } else {
        layer = L.tileLayer(radarTileUrl(frame), {
          minZoom: 2, maxZoom: 11, maxNativeZoom: 7, tileSize: 512, zoomOffset: -1,
          keepBuffer: 0, opacity: 0, className: 'radar-frame',
          attribution: '<a href="https://www.rainviewer.com/">RainViewer</a>'
        });
      }
      layer.frameIndex = index;
      layer.ready = false;
      layer.failed = false;
      layer.on('loading', function() {
        // Leaflet can retain failed tiles during another load; a new layer clears failure.
        layer.ready = false;
        if (radarLayer === layer || pendingLayer === layer) setStatus(loadingText());
        if (radarLayer === layer) {
          clearTimeout(panTimeout);
          panTimeout = setTimeout(function() {
            if (radarLayer !== layer || layer.ready) return;
            layer.failed = true; stopPlay(); setStatus(unavailableText());
          }, REQUEST_TIMEOUT_MS);
        }
      });
      layer.on('load', function() {
        layer.ready = !layer.failed;
        if (pendingLayer === layer && layer.ready) commitFrame(layer);
        else if (radarLayer === layer) {
          clearTimeout(panTimeout); panTimeout = null;
          setStatus(layer.failed ? unavailableText() : '');
        }
      });
      function failed() {
        layer.failed = true;
        if (radarLayer === layer || pendingLayer === layer) {
          stopPlay(); setStatus(unavailableText());
          if (pendingLayer === layer) {
            clearTimeout(tileTimeout); tileTimeout = null;
            pendingLayer = null; map.removeLayer(layer);
            document.getElementById('slider').value = frameIndex;
          }
        }
      }
      layer.on('tileerror', failed);
      layer.on('error', failed);
      return layer;
    }

    function loadingText() { return mode === 'forecast' ? FORECAST_TEXT[2] : TEXT.loading; }
    function unavailableText() { return mode === 'forecast' ? FORECAST_TEXT[3] : TEXT.unavailable; }

    function forecastIsFresh(cached) {
      var now = Date.now();
      return cached && cached.loadedAt <= now && now - cached.loadedAt < REFRESH_INTERVAL_MS &&
        now / 1000 - cached.run <= 12 * 3600 && cached.frames.length >= 3 && cached.frames.length <= 15 &&
        cached.frames[cached.frames.length - 1].time >= now / 1000 + 12 * 3600;
    }

    function ensureForecastFresh() {
      if (mode !== 'forecast') return true;
      if (!frames.length) {
        if (forecastRefreshPending && !document.hidden) loadForecast();
        return !activeRequest;
      }
      if (forecastIsFresh(forecastCache) && frames === forecastCache.frames) return true;
      stopPlay(); clearRadarLayer(); frames = []; forecastCache = null;
      document.getElementById('play').disabled = document.getElementById('slider').disabled = true;
      document.getElementById('time').textContent = '—';
      updateTimeline();
      document.getElementById('source').textContent = 'Deutscher Wetterdienst';
      setStatus(FORECAST_EXPIRED[language]);
      forecastRefreshPending = true;
      if (!document.hidden) loadForecast();
      return false;
    }

    function commitFrame(layer) {
      if (pendingLayer !== layer || !ensureForecastFresh()) return;
      clearTimeout(tileTimeout); tileTimeout = null;
      clearTimeout(panTimeout); panTimeout = null;
      clearTimeout(transitionTimer);
      if (retiredLayer) map.removeLayer(retiredLayer);
      retiredLayer = radarLayer;
      radarLayer = layer; pendingLayer = null;
      frameIndex = layer.frameIndex;
      layer.setOpacity(0.78);
      if (retiredLayer) {
        retiredLayer.setOpacity(0);
        transitionTimer = setTimeout(function() {
          if (retiredLayer) map.removeLayer(retiredLayer);
          retiredLayer = null; transitionTimer = null;
        }, 350);
      }
      var frame = frames[frameIndex];
      var label = frame.type === 'forecast' ? forecastIntervalLabel(frame) : formatTime(frame.time);
      document.getElementById('time').textContent = label;
      document.getElementById('slider').value = frameIndex;
      document.getElementById('slider').setAttribute('aria-valuetext', label);
      var summary = document.getElementById('frame-summary');
      summary.hidden = frame.type !== 'forecast';
      if (frame.type === 'forecast') {
        summary.textContent = RadarForecast.sources[frame.key].model + ' · ' + FORECAST_TEXT[5] +
          ' · ' + FORECAST_TEXT[frame.hours === 1 ? 6 : 7];
      }
      setStatus('');
      if (preloadLayer) map.removeLayer(preloadLayer);
      preloadLayer = null;
      if (frames.length > 1) {
        preloadLayer = newFrameLayer((frameIndex + 1) % frames.length);
        preloadLayer.addTo(map);
      }
    }

    function forecastIntervalLabel(frame) {
      var start = frame.time - frame.hours * 3600;
      var day = function(time) {
        return new Date(time * 1000).toLocaleDateString(language, { weekday: 'short', timeZone: timezone });
      };
      return day(start) + ' ' + formatTime(start, false) + '–' +
        (day(start) !== day(frame.time) ? day(frame.time) + ' ' : '') + formatTime(frame.time);
    }

    function cancelSeek() {
      clearTimeout(seekTimer);
      seekTimer = null;
      seekIndex = null;
    }

    function flushSeek() {
      var index = seekIndex;
      cancelSeek();
      if (index !== null) showFrame(index);
    }

    function seekFrame(index) {
      stopPlay();
      cancelSeek();
      if (pendingLayer) map.removeLayer(pendingLayer);
      pendingLayer = null;
      clearTimeout(tileTimeout); tileTimeout = null;
      seekIndex = index;
      seekTimer = setTimeout(flushSeek, 120);
    }

    function showFrame(index) {
      if (!ensureForecastFresh()) return;
      if (!frames.length) { setStatus(unavailableText()); return; }
      if (!Number.isFinite(index)) return;
      index = Math.max(0, Math.min(Math.round(index), frames.length - 1));
      if (pendingLayer) map.removeLayer(pendingLayer);
      clearTimeout(tileTimeout);
      var layer = preloadLayer && preloadLayer.frameIndex === index && !preloadLayer.failed ? preloadLayer : newFrameLayer(index);
      if (layer === preloadLayer) preloadLayer = null;
      pendingLayer = layer;
      if (layer.ready) { commitFrame(layer); return; }
      setStatus(loadingText());
      tileTimeout = setTimeout(function() {
        if (pendingLayer !== layer) return;
        pendingLayer = null; map.removeLayer(layer); tileTimeout = null;
        stopPlay(); setStatus(unavailableText());
      }, REQUEST_TIMEOUT_MS);
      layer.addTo(map);
    }

    function setMode(next) {
      if (next === mode) return;
      ++requestToken;
      if (activeRequest) activeRequest.abort();
      activeRequest = null;
      stopPlay(); clearRadarLayer();
      forecastRefreshPending = false;
      mode = next;
      frames = [];
      updateTimeline();
      document.getElementById('play').disabled = document.getElementById('slider').disabled = true;
      document.getElementById('time').textContent = '—';
      document.getElementById('source').textContent = mode === 'forecast' ? 'Deutscher Wetterdienst' : 'RainViewer · ' + FORECAST_TEXT[0];
      document.getElementById('map').setAttribute('aria-label', mode === 'forecast' ? FORECAST_TEXT[1] : TEXT.map);
      document.getElementById('legend').textContent = '';
      ['observed', 'forecast'].forEach(function(name) {
        document.getElementById(name).className = name === mode ? 'active' : '';
        document.getElementById(name).setAttribute('aria-pressed', String(name === mode));
      });
      document.getElementById('coverage').hidden = mode === 'forecast';
      document.getElementById('legend').hidden = mode !== 'forecast';
      document.getElementById('scale').hidden = true;
      document.getElementById('retry').setAttribute('aria-label', mode === 'forecast' ? FORECAST_TEXT[4] : CONTROL_TEXTS[language][0]);
      document.getElementById('slider').setAttribute('aria-label', mode === 'forecast' ? FORECAST_TEXT[1] : CONTROL_TEXTS[language][1]);
      if (coverageLayer) map.removeLayer(coverageLayer);
      refreshMap();
    }

    function refreshMap() { if (mode === 'forecast') loadForecast(true); else loadRadar(); }

    function selectedForecast() {
      var bounds = map.getBounds();
      var europe = forecastIsFresh(forecastModels.eu) ? forecastModels.eu : null;
      var key = RadarForecast.sourceFor({ west: bounds.getWest(), east: bounds.getEast(),
        south: bounds.getSouth(), north: bounds.getNorth() }, europe && europe.bounds);
      return forecastIsFresh(forecastModels[key]) ? forecastModels[key] : null;
    }

    function loadForecast(retryTiles) {
      if (activeRequest) return;
      forecastRefreshPending = false;
      var cached = selectedForecast();
      if (cached) {
        if (retryTiles || forecastCache !== cached || !frames.length) installForecast(cached);
        return;
      }
      stopPlay(); clearRadarLayer(); frames = [];
      updateTimeline();
      document.getElementById('play').disabled = document.getElementById('slider').disabled = true;
      document.getElementById('time').textContent = '—';
      document.getElementById('source').textContent = 'Deutscher Wetterdienst';
      document.getElementById('scale').hidden = true;
      if (Date.now() < forecastRetryAt) {
        setStatus(FORECAST_TEXT[8]); return;
      }
      if (forecastRefreshFailed && !retryTiles) {
        setStatus(FORECAST_TEXT[3]); return;
      }
      forecastRefreshFailed = false;
      var token = ++requestToken;
      setStatus(FORECAST_TEXT[2]);
      var controller = new AbortController(); activeRequest = controller;
      var timeout = setTimeout(function() { controller.abort(); }, REQUEST_TIMEOUT_MS);
      Promise.all(['eu', 'global'].map(function(key) {
        return fetch(RadarForecast.capabilitiesUrl(key), { signal: controller.signal }).then(function(response) {
          if (response.status === 429) forecastRetryAt = Date.now() + REFRESH_INTERVAL_MS;
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return RadarForecast.read(response);
        }).then(function(xml) {
          var parsed = RadarForecast.parse(xml, key, Date.now() / 1000);
          parsed.loadedAt = Date.now();
          return parsed;
        }).catch(function() { return null; });
      })).then(function(models) {
        if (token !== requestToken || mode !== 'forecast') return;
        forecastModels = { eu: models[0], global: models[1] };
        var selected = selectedForecast();
        if (!selected) throw new Error('Forecast unavailable');
        installForecast(selected);
      }).catch(function() {
        if (token === requestToken && mode === 'forecast') {
          forecastRefreshFailed = true;
          setStatus(FORECAST_TEXT[3]);
        }
      }).finally(function() {
        clearTimeout(timeout);
        if (token === requestToken) activeRequest = null;
      });
    }

    function installForecast(cached) {
      clearRadarLayer();
      frames = cached.frames; forecastCache = cached;
      forecastRefreshFailed = false;
      var source = RadarForecast.sources[cached.key];
      document.getElementById('source').textContent = 'Deutscher Wetterdienst · ' + source.model + ' · CC BY 4.0';
      document.getElementById('legend').textContent = FORECAST_TEXT[9];
      document.getElementById('scale').src = RadarForecast.legendUrl(cached.key);
      document.getElementById('scale').alt = source.model + ' · ' + FORECAST_TEXT[source.hours === 1 ? 6 : 7];
      document.getElementById('scale').hidden = false;
      document.getElementById('slider').max = frames.length - 1;
      updateTimeline();
      document.getElementById('play').disabled = document.getElementById('slider').disabled = false;
      forecastExpiryTimer = setTimeout(ensureForecastFresh, Math.max(0, Math.min(
        cached.loadedAt + REFRESH_INTERVAL_MS - Date.now(),
        (cached.run + 12 * 3600) * 1000 - Date.now(),
        frames[frames.length - 1].time * 1000 - Date.now() - 12 * 3600000
      )) + 1);
      frameIndex = 0; showFrame(0);
    }

    function formatTime(epochSeconds, showZone) {
      return new Date(epochSeconds * 1000).toLocaleTimeString(language, {
        timeZone: timezone, hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
        timeZoneName: showZone === false ? undefined : 'short'
      });
    }

    function updateTimeline() {
      function endpoint(time) {
        return new Date(time * 1000).toLocaleDateString(language, { weekday: 'short', timeZone: timezone }) +
          ' ' + formatTime(time, false);
      }
      document.getElementById('range-start').textContent = frames.length ?
        endpoint(frames[0].time - (mode === 'forecast' ? frames[0].hours * 3600 : 0)) : '—';
      document.getElementById('range-end').textContent = frames.length ? endpoint(frames[frames.length - 1].time) : '—';
      if (!frames.length) document.getElementById('frame-summary').hidden = true;
    }

    function stopPlay() {
      clearInterval(timer);
      timer = null;
      var button = document.getElementById('play');
      button.setAttribute('aria-pressed', 'false');
      button.setAttribute('aria-label', TEXT.play);
    }

    function togglePlay() {
      if (!ensureForecastFresh()) return;
      flushSeek();
      var button = document.getElementById('play');
      if (timer) {
        stopPlay();
        return;
      }
      if (!frames.length) return;
      button.setAttribute('aria-pressed', 'true');
      button.setAttribute('aria-label', TEXT.pause);
      timer = setInterval(function() {
        if (ensureForecastFresh() && !pendingLayer) showFrame((frameIndex + 1) % frames.length);
      }, 1000);
    }

    function loadRadar() {
      if (mode !== 'observed') return;
      var token = ++requestToken;
      stopPlay();
      if (activeRequest) activeRequest.abort();
      var controller = new AbortController();
      activeRequest = controller;
      var timeout = setTimeout(function() { controller.abort(); }, REQUEST_TIMEOUT_MS);
      frames = [];
      updateTimeline();
      clearRadarLayer();
      document.getElementById('play').disabled = true;
      document.getElementById('slider').disabled = true;
      document.getElementById('time').textContent = '—';
      setStatus(TEXT.loading);
      document.getElementById('source').textContent = 'RainViewer · ' + FORECAST_TEXT[0];
      fetch('https://api.rainviewer.com/public/weather-maps.json', { cache: 'no-store', signal: controller.signal })
        .then(function(response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(function(manifest) {
          if (token !== requestToken) return;
          if (!manifest || manifest.host !== 'https://tilecache.rainviewer.com' ||
              !manifest.radar || !Array.isArray(manifest.radar.past)) {
            throw new Error('Invalid RainViewer manifest');
          }
          tileHost = manifest.host;
          frames = manifest.radar.past.slice(-MAX_FRAMES);
          var now = Date.now() / 1000;
          if (!frames.length || !frames.every(function(frame, index) {
            return frame && Number.isInteger(frame.time) && frame.time <= now + 300 &&
              typeof frame.path === 'string' && /^\/v2\/radar\/[A-Za-z0-9_-]{1,128}$/.test(frame.path) &&
              (index === 0 || frame.time > frames[index - 1].time);
          }) || now - frames[frames.length - 1].time > MAX_FRAME_AGE_SECONDS) {
            throw new Error('Invalid or stale radar frames');
          }
          lastLoadedAt = Date.now();
          updateTimeline();
          installCoverageLayer();
          if (coverageVisible && coverageLayer) coverageLayer.addTo(map);
          var slider = document.getElementById('slider');
          slider.max = frames.length - 1;
          frameIndex = frames.length - 1;
          slider.value = frameIndex;
          slider.disabled = false;
          document.getElementById('play').disabled = false;
          showFrame(frameIndex);
        })
        .catch(function() {
          if (token !== requestToken) return;
          clearRadarLayer();
          frames = [];
          setStatus(TEXT.unavailable);
        })
        .finally(function() {
          clearTimeout(timeout);
          if (token === requestToken) activeRequest = null;
        });
    }

    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        stopPlay();
        clearTimeout(seekTimer); seekTimer = null;
      } else {
        if (mode === 'observed' && Date.now() - lastLoadedAt >= REFRESH_INTERVAL_MS) loadRadar();
        else if (mode === 'forecast' && !ensureForecastFresh()) return;
        flushSeek();
      }
    });
    window.addEventListener('online', function() {
      if (mode === 'observed') loadRadar(); else ensureForecastFresh();
    });

    function selfTest() {
      if (coordinate('91', -90, 90, 1) !== 1 || coordinate('-33.8', -90, 90, 1) !== -33.8) {
        throw new Error('Radar coordinate self-test failed');
      }
      if (MAX_FRAMES !== 20 || !coverageTileUrl().includes('/v2/coverage/0/')) {
        throw new Error('Radar contract self-test failed');
      }
    }

    selfTest();
    loadRadar();
  </script>
</body>
</html>
