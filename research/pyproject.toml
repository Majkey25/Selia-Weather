[project]
name = "aladin-ensemble-research"
version = "0.1.0"
description = "Reproducible Czech forecast-model registry research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "eccodes==2.50.1",
    "ecmwf-opendata==0.3.35",
    "h5py==3.16.0",
    "numpy==2.5.5",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src"]
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
